general {
    lock_cmd = wl-copy -c; swaync-client --dnd-on; ~/bin/lock-screen
    unlock_cmd = swaync-client --dnd-off
    before_sleep_cmd = loginctl lock-session
    # Any DPMS call right after resume leaves DP-2 disabled in KMS, so do nothing here
    after_sleep_cmd =
}

# Lock after 10 min
listener {
    timeout = 600
    on-timeout = loginctl lock-session
    # do not lock during a video call; recheck every minute
    condition_cmd = ! fuser -s /dev/video* 2>/dev/null
    condition_retry = 60
}

# Monitor off shortly after lock
listener {
    timeout = 610
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
    # same as above: keep the screen on while the camera is in use
    condition_cmd = ! fuser -s /dev/video* 2>/dev/null
    condition_retry = 60
}

# Suspend after 3 min idle past lock
listener {
    timeout = 780
    on-timeout = systemctl suspend
    # do not suspend while audio is playing; recheck every minute. checks stream links, not
    # device state: the pro-audio sink never stops, which is why sway-audio-idle-inhibit is useless
    condition_cmd = ! wpctl status | sed -n '/Streams:/,$p' | grep -q '\[active\]'
    condition_retry = 60
}
