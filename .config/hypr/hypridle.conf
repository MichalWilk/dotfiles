general {
    lock_cmd = wl-copy -c; swaync-client --dnd-on; ~/bin/lock-screen
    unlock_cmd = swaync-client --dnd-off
    before_sleep_cmd = loginctl lock-session
    # any DPMS call right after resume leaves DP-2 disabled in KMS
    after_sleep_cmd =
}

# Lock after 10 min
listener {
    timeout = 600
    on-timeout = loginctl lock-session
    condition_cmd = ! fuser -s /dev/video* 2>/dev/null
    condition_retry = 60
}

# Monitor off shortly after lock
listener {
    timeout = 610
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
    condition_cmd = ! fuser -s /dev/video* 2>/dev/null
    condition_retry = 60
}

# Suspend after 3 min idle past lock
listener {
    timeout = 780
    on-timeout = systemctl suspend
    condition_cmd = ! wpctl status | sed -n '/Streams:/,$p' | grep -q '\[active\]'
    condition_retry = 60
}
